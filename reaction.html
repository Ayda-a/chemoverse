<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reaction Simulator</title>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 50px;
        }

        h1 {
            font-size: 40px;
        }

        .btn {
            padding: 12px 25px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            background: #38bdf8;
            cursor: pointer;
            font-size: 16px;
        }

        .btn:hover {
            background: #0ea5e9;
        }

        .box {
            margin-top: 30px;
            padding: 20px;
            background: #1e293b;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<h1>🧪 Reaction Simulator</h1>
<p>Welcome! Start mixing chemicals below.</p>

<!-- Buttons -->
<button class="btn" onclick="neutral('neutralization')">Neutralization</button>
<button class="btn" onclick="show('equilibrium')">Equilibrium</button>
<button class="btn" onclick="click('definite')">Law of Definite Proportion</button>
<button class="btn" onclick="reveal('precipitation')">Precipitation</button>
<button class="btn" onclick="goBack()">⬅ Back to Home</button>
<script>

function goBack() {
    window.location.href = "bodypr.html";
}
function neutral(){
 window.location.href="neutralization.html"

}
function reveal(){
   window.location.href="precipitation.html" 
}
function show(){
   window.location.href="equilibrium.html" 
}



</script>

</body>
</html>
